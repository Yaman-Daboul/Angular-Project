<div class="login-container" style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
  <h2>Login to Task Manager</h2>

  <form (ngSubmit)="onLogin()">
    <div style="margin-bottom: 15px;">
      <label>Email:</label><br>
      <input type="email" [(ngModel)]="email" name="email" required style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Password:</label><br>
      <input type="password" [(ngModel)]="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <button type="submit" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Login
    </button>
  </form>

  <p *ngIf="errorMessage" style="color: red; margin-top: 15px;">{{ errorMessage }}</p>
</div>
