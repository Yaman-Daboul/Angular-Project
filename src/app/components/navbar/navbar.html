<nav style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #0f172a; color: white; font-family: sans-serif;">
  <!-- شعار التطبيق ويرجع للصفحة الرئيسية -->
  <a
    routerLink="/"
    style="font-weight: bold; font-size: 18px; color: white; text-decoration: none;"
  >
    🚀 Task Manager App
  </a>

  <!-- روابط التنقل -->
  <div style="display: flex; gap: 20px; align-items: center;">
    @for (link of navLinks; track link.path) {
      <!-- [routerLink] ينقل المستخدم للمسار المحدد بدون إعادة تحميل كاملة للصفحة -->
      <a
        [routerLink]="link.path"
        style="cursor: pointer; color: #cbd5e1; font-size: 14px; text-decoration: none;"
      >
        {{ link.label }}
      </a>
    }
  </div>

  <!-- الترحيب وزر الخروج -->
  <div style="display: flex; align-items: center; gap: 15px;">
    <span style="font-size: 14px; color: #cbd5e1;">Welcome, {{ username }}</span>

    <button
      (click)="onLogout()"
      style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;"
    >
      Logout
    </button>
  </div>
</nav>
